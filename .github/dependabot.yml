# Weekly dependency update PRs into `dev`. Nothing auto-merges: every update goes
# through the required checks like any other PR.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Skip versions published in the last 3 days.
    cooldown:
      default-days: 3
    # Pinned to Node 24 (LTS). Moving to a new Node major is a deliberate decision.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native port) ships no classic compiler API, and typescript-eslint
      # 8.x needs it (peer typescript <6.1.0). Lift this when typescript-eslint supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # ESLint majors land together: eslint 10 alone breaks @eslint/js 9, and vice versa.
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "globals"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "@types/react-*"]
      vite:
        patterns: ["vite", "@vitejs/*", "@tailwindcss/vite", "tailwindcss"]
      # The groups below skip packages already grouped above, so each update lands in one PR.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          [
            "react",
            "react-dom",
            "@types/react*",
            "vite",
            "@vitejs/*",
            "@tailwindcss/vite",
            "tailwindcss",
            "eslint",
            "@eslint/*",
            "eslint-plugin-*",
            "typescript-eslint",
            "globals",
          ]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          [
            "react",
            "react-dom",
            "@types/react*",
            "vite",
            "@vitejs/*",
            "@tailwindcss/vite",
            "tailwindcss",
          ]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
